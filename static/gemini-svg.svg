<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="100" fill="#0d1117"/>
  
  <!-- Sound Wave Equalizer Bars forming a Checkmark shape -->
  <g fill="#2fe6de">
    <!-- Left bar / note stem -->
    <rect x="150" y="240" width="30" height="80" rx="15" />
    <rect x="200" y="280" width="30" height="90" rx="15" />
    
    <!-- Center drop of the checkmark -->
    <rect x="250" y="320" width="30" height="100" rx="15" />
    
    <!-- Right rising checkmark bars -->
    <rect x="300" y="220" width="30" height="160" rx="15" />
    <rect x="350" y="140" width="30" height="180" rx="15" />
  </g>
  
  <!-- Glow accent -->
  <circle cx="365" cy="155" r="25" fill="#00ffb3" opacity="0.8"/>
</svg>
